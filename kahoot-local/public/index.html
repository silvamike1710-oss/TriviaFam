<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Comuhoot — Join</title>
  <link rel="stylesheet" href="index.css" />
</head>
<body>
  <div class="card">
    <div class="logo">Comuhoot</div>
    <p class="subtitle">Trivia grátis</p>

    <div class="field">
      <label for="name">Seu nome</label>
      <input id="name" placeholder="insira seu nome" autocomplete="off" />
    </div>

    <div class="field">
      <label for="pin">senha</label>
      <input id="pin" placeholder="senha de 6 digitos" maxlength="6" autocomplete="off" />
    </div>

    <button class="btn" onclick="join()">Entrar no Jogo</button>

    <div class="divider">or</div>

    <a class="btn btn-secondary" href="/host.html">Criar um Jogo</a>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    function join() {
      const name = document.getElementById("name").value.trim();
      const pin = document.getElementById("pin").value.trim();
      if (!name || !pin) return;

      socket.emit("join_game", { pin, name });
      localStorage.setItem("pin", pin);
      localStorage.setItem("name", name);
      window.location.href = "/player.html";
    }

    document.getElementById("pin").addEventListener("keydown", (e) => {
      if (e.key === "Enter") join();
    });
  </script>
</body>
</html>
